name: ScreenBridgeDemo
options:
  bundleIdPrefix: dev.screenbridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ScreenBridge:
    url: https://github.com/MachangDoniel/ScreenBridge.git
    from: 0.1.0
targets:
  ScreenBridgeDemo:
    type: application
    platform: iOS
    sources:
      - ScreenBridgeDemo
    dependencies:
      - package: ScreenBridge
        product: ScreenBridge
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SB Demo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Required for ScreenBridge (Debug builds use them; harmless in Release).
        NSLocalNetworkUsageDescription: ScreenBridge sends debug reports to the Mac that built this app.
        NSBonjourServices:
          - _screenbridge._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenbridge.demo
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The ScreenBridge phase reads git state and ~/Library/Application Support/ScreenBridge.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: ScreenBridge Connection
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ScreenBridgeConnection.json
        script: |
          # ScreenBridge — generates the development connection file (Debug only).
          # Output Files: $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ScreenBridgeConnection.json
          # Uncheck "Based on dependency analysis": git state is not an Xcode-tracked input.
          SB="${HOME}/Library/Application Support/ScreenBridge/bin/screenbridge"
          if [ -x "$SB" ]; then
            "$SB" build-configure
          else
            echo "warning: ScreenBridge helper is not installed. Open ScreenBridge.app once, then rebuild. The app will run without a Mac connection."
            rm -f "${SCRIPT_OUTPUT_FILE_0}"
          fi
